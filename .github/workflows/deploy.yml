name: Deploy React Site to Pages

on:
  push:
    branches: ["main"] # Triggers automatically when you push code to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ylink-frontend/package-lock.json' # Tracks your nested subfolder paths

      - name: Install Dependencies
        run: npm ci
        working-directory: ylink-frontend # Forces build environment inside subfolder

      - name: Build Static Production Assets
        run: npm run build
        working-directory: ylink-frontend # Forces execution inside subfolder

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'ylink-frontend/dist' # Uploads target production bundle folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4